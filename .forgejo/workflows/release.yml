name: Release

on: [workflow_dispatch]

env:
  app_file: Chromium-WinUpdater
  app_name: Chromium WinUpdater

jobs:
  release:
    runs-on: codeberg-small
    container:
      image: scottyhardy/docker-wine:stable
    steps:
      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nodejs zip 7zip

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Ahk2Exe
        env:
          DL_AUTOHOTKEY: ${{ vars.DL_AUTOHOTKEY }}
          SHA_AUTOHOTKEY: ${{ vars.SHA_AUTOHOTKEY }}
        run: |
          wget -qO ahk.zip ${{ env.DL_AUTOHOTKEY }}
          echo "${{ env.SHA_AUTOHOTKEY }} ahk.zip" | sha256sum -c || exit 1
          unzip -j ahk.zip Compiler/Ahk2Exe.exe "Compiler/Unicode 32-bit.bin"
          rm ahk.zip

      - name: Set up Resource Hacker
        env:
          DL_RESHACKER: ${{ vars.DL_RESHACKER }}
          SHA_RESHACKER: ${{ vars.SHA_RESHACKER }}
        run: |
          wget -qO rh.zip ${{ env.DL_RESHACKER }}
          echo "${{ env.SHA_RESHACKER }} rh.zip" | sha256sum -c || exit 1
          unzip rh.zip ResourceHacker.exe
          rm rh.zip

      - name: Download 7za
        run: |
          wget -qO 7z.json https://api.github.com/repos/ip7z/7zip/releases/latest
          grep -Eo "https://github.com/ip7z/7zip/releases/download/[0-9\.]+/7z[0-9]+-extra.7z" 7z.json | wget -qO 7za.7z -i -
          7z e 7za.7z 7za.exe
          rm 7za.7z

      - name: Build executable
        run: |
          xvfb-run wine Ahk2Exe.exe /silent verbose /in ${{ env.APP_FILE }}.ahk

      - id: virustotal
        if: ${{ secrets.VT_API_KEY != '' }}
        name: Scan with VirusTotal
        uses: https://github.com/crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            ./${{ env.APP_FILE }}.exe

      - name: Get VirusTotal URL
        if: ${{ secrets.VT_API_KEY != '' }}
        env:
          ANALYSIS: ${{ steps.virustotal.outputs.analysis }}
        run: |
          VT_URL=$(echo "${ANALYSIS}" | grep -oP ".*exe=\K.*")
          echo "VT_URL=${VT_URL}" >> $GITHUB_ENV
          echo "${VT_URL}"

      - name: Create zip
        run: |
          APP_VERSION=$(grep -oP "SetFileVersion \K[\d.]+" ${{ env.APP_FILE }}.ahk)
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
          mkdir ./dist
          zip ./dist/${{ env.APP_FILE }}_${APP_VERSION}.zip ${{ env.APP_FILE }}.exe ${{ env.APP_FILE }}.url *.ps1 *.template.ini 7za-License.txt

      - name: Upload artifacts
        uses: forgejo/upload-artifact@v4
        with:
          path: |
            dist/${{ env.APP_FILE }}*.zip
          retention-days: 7

      - name: Generate checksums
        run: |
          cd dist
          for file in *; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Create release
        uses: actions/forgejo-release@v2.13.4
        with:
          direction: upload
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          token: ${{ secrets.FORGE_TOKEN }}
          tag: ${{ env.APP_VERSION }}
          title: ${{ env.APP_NAME }} ${{ env.APP_VERSION }}
          override: true
          prerelease: true
          release-dir: dist
          release-notes: |
            - [x] 
            - [x] 
            
            > [!NOTE]
            > The authenticity of the release `.zip` can be verified with GPG ([instructions](https://codeberg.org/ltguillaume/resources/src/branch/main/signing)).
            
            > [!CAUTION]
            > [Link to VirusTotal Report](${{ env.VT_URL }})
            > Some antivirus software might mark this as malware. [This is a false positive](https://www.autohotkey.com/docs/v1/FAQ.htm#Virus). Please report the program as safe if possible.
            > <details><summary>Known problematic vendors</summary><em>Arctic Wolf, Bkav, CrowdStrike, DeepInstinct, Gridinsoft, NANO-Antivirus, Palo Alto, SecureAge, SentinelOne, Skyhigh, Symantec, Trapmine, Trellix, VirIT, Zillya.</em></details>
